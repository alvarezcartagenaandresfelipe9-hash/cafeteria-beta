<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comanda - POS</title>

    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="../css/carrito.css">
</head>
<body class="iframe-body">

    <aside class="cart-drawer-content">
        <!-- Header -->
        <header class="cart-header">
            <div class="cart-title">
                <i class="fa-solid fa-bag-shopping"></i>
                <h2>Comanda <span id="lblIframeMesa">--</span></h2>
            </div>
            <label class="cart-close-btn" onclick="cerrarIframePadre()">
                <i class="fa-solid fa-xmark"></i>
            </label>
        </header>

        <!-- Lista Dinámica de Ítems -->
        <div class="cart-body" id="cartBody">
            <p style="text-align: center; color: #7A6A60; margin-top: 30px;">Cargando comanda...</p>
        </div>

        <!-- Footer / Pago -->
        <footer class="cart-footer">
            <div class="cart-summary-row total">
                <span>Total Comanda</span>
                <span id="cartTotal">$0.00</span>
            </div>

            <div style="margin-top: 15px;">
                <label style="font-size: 0.85rem; color: #7A6A60; font-weight: 600;">Método de Pago:</label>
                <select id="selectMetodoPago" class="modal-select" style="margin-top: 5px; margin-bottom: 10px; padding: 8px; width: 100%;">
                    <option value="EFECTIVO">Efectivo</option>
                    <option value="TARJETA">Tarjeta de Débito/Crédito</option>
                    <option value="NEQUI">Nequi / Transferencia</option>
                </select>
            </div>

            <button class="checkout-btn" onclick="facturarDesdeIframe()">
                <i class="fa-solid fa-receipt"></i> Facturar y Cerrar Mesa
            </button>
        </footer>
    </aside>

    <script>
        function cargarComandaIframe() {
            const padre = window.parent;
            const body = document.getElementById('cartBody');
            const totalLbl = document.getElementById('cartTotal');
            const lblMesa = document.getElementById('lblIframeMesa');

            const mesaId = padre.mesaDispositivo || localStorage.getItem('dispositivo_mesa_id') || 1;
            if (lblMesa) lblMesa.textContent = `Mesa ${mesaId}`;

            if (!padre || typeof padre.obtenerComandaMesa !== 'function') {
                body.innerHTML = '<p style="text-align: center; color: #7A6A60; margin-top: 30px;">Esperando conexión con la base de datos...</p>';
                return;
            }

            const comanda = padre.obtenerComandaMesa(mesaId);

            if (!comanda || !comanda.items || comanda.items.length === 0) {
                body.innerHTML = '<p style="text-align: center; color: #7A6A60; margin-top: 30px;">No hay productos pedidos para esta mesa.</p>';
                totalLbl.textContent = '$0.00';
                return;
            }

            body.innerHTML = '';
            comanda.items.forEach(item => {
                body.innerHTML += `
                    <article class="cart-item">
                        <img src="${item.imagen}" alt="${item.nombre}" class="cart-item-img">
                        <div class="cart-item-details">
                            <h4>${item.nombre}</h4>
                            <span class="cart-item-price">$${Number(item.precioUnitario).toFixed(2)} c/u</span>
                            
                            <!-- Botones de Cantidad (+ / -) -->
                            <div class="cart-item-qty">
                                <button class="qty-btn" onclick="window.parent.decrementarCantidadDetalle(${item.detalleId})">
                                    <i class="fa-solid fa-minus"></i>
                                </button>
                                <span style="font-weight:700; color:#2C1810; min-width: 20px; text-align: center;">${item.cantidad}</span>
                                <button class="qty-btn" onclick="window.parent.incrementarCantidadDetalle(${item.detalleId})">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                                <span style="font-weight:700; color:#8C5A3C; margin-left: auto;">$${Number(item.subtotal).toFixed(2)}</span>
                            </div>
                        </div>
                        
                        <!-- Botón Eliminar Ítem -->
                        <button class="remove-btn" title="Quitar ítem" onclick="window.parent.eliminarDetalleOrden(${item.detalleId})">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </article>
                `;
            });

            totalLbl.textContent = `$${Number(comanda.total).toFixed(2)}`;
        }

        function cerrarIframePadre() {
            if (window.parent && window.parent.document) {
                const toggle = window.parent.document.getElementById('cart-toggle');
                if (toggle) toggle.checked = false;
            }
        }

        function facturarDesdeIframe() {
            const padre = window.parent;
            const metodo = document.getElementById('selectMetodoPago').value;
            if (padre && typeof padre.procesarVentaMesa === 'function') {
                padre.procesarVentaMesa(metodo);
                cerrarIframePadre();
            }
        }

        window.cargarComandaIframe = cargarComandaIframe;
        document.addEventListener('DOMContentLoaded', cargarComandaIframe);
        setInterval(cargarComandaIframe, 800);
    </script>
</body>
</html>
